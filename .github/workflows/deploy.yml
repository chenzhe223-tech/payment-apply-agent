name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 项目仓库部署在 https://<user>.github.io/<repo>/ 之下，
      # 因此 base 需带仓库名前缀；用户主页仓库则为 '/'。
      - name: Resolve base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          DEPLOY_BASE: ${{ steps.base.outputs.base }}
        run: npx vite build --config vite.config.static.ts

      # GitHub Pages 只认 index.html；同时拷贝一份 404.html 作为
      # SPA 深链接回退（访问 /repo/flow 时由前端路由接管）。
      - name: Post-process (rename + SPA fallback)
        run: |
          cd dist-static
          mv index.static.html index.html
          cp index.html 404.html
          touch .nojekyll
          echo "--- dist-static ---"
          ls -la
          echo "--- assets ---"
          ls -la assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
